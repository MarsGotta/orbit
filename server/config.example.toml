# Adjust paths and URLs to your server. Never keep secrets in this file.
data_dir = "/opt/orbit/data"
key_file = "/opt/orbit/secrets/storage.key"
hermes_url = "http://127.0.0.1:8643"
hermes_credential_file = "/opt/orbit/secrets/hermes-token"
hermes_ws_auth = "token"
profile = "default"
allow_insecure_localhost = true
allowed_hosts = ["localhost", "127.0.0.1", "hub.example"]

# Several agents: this file is one agent, `default`, made of `profile` and
# `assistant_name`. To offer more, list [[agents]] tables instead of those two
# keys, as docs/self-hosting.md#several-agents shows.

# Meeting transcription. Required: without this table the hub does not start.
# Any service compatible with OpenAI's transcription API; plain http only on
# loopback. Without `language`, Whisper detects the language itself.
[meeting_transcription]
endpoint = "http://127.0.0.1:6394"
model = "openai/whisper-large-v3"

# The model that writes meeting notes: title, summary per template, tasks,
# decisions and open topics. Any OpenAI-compatible API that honours
# `response_format: json_schema`. Without this table meetings are still
# transcribed and their note says that no model is configured. The key lives
# only in its own 0600 file owned by the hub's user.
# [processing]
# endpoint = "https://model.example.test/v1/chat/completions"
# model = "example-model"
# credential_file = "/opt/orbit/secrets/processing.key"
# "off" asks the model not to reason before answering (measured on Qwen: 30 s
# instead of 75 s for a two-hour meeting, both valid). "provider_default"
# sends nothing.
# reasoning = "off"
# timeout_seconds = 300
# max_completion_tokens = 8192
# context_tokens = 131072

# Device bridge: through orbit-mcp, Deimos sees the Mac's screen, selected text
# and calendar, and controls it. The key signs orbit-mcp's private requests;
# a 0600 file of 32 bytes.
# [device_bridge]
# key_id = "device-bridge"
# credential_file = "/opt/orbit/secrets/device-bridge.key"

# Meetings for Deimos: orbit-mcp's orbit_meetings, orbit_transcript and
# orbit_note. Same shape as the bridge, with its own key.
# [meetings_bridge]
# key_id = "meetings"
# credential_file = "/opt/orbit/secrets/meetings.key"

# Error reports to Sentry. Without this table nothing is sent. Only codes, the
# `op`, the route template and numbers are sent: never an exception's text or
# any content. See docs/self-hosting.md.
# [error_reports]
# dsn = "https://<public key>@<organization>.ingest.<region>.sentry.io/<project>"

# Speaker separation in the final pass, local and offline: a pyannote runtime
# with its own Python, the model bundle and the lock shared with the
# transcription service. Without this table the draft transcript stays and the
# final pass reports diarization_not_configured.
# [diarization]
# python = "/opt/orbit/diarization/bin/python"
# bundle = "/opt/orbit/models/community-1"
# gpu_lock = "/opt/orbit/data/inference.lock"
