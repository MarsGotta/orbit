[project]
name = "orbit-hub"
version = "0.12.8"
description = "Orbit hub: the authenticated bridge between Orbit devices and a Hermes assistant profile"
requires-python = ">=3.11"
dependencies = ["claude-agent-sdk==0.2.174", "cryptography", "fastapi", "httpx", "mcp>=2.2,<3", "pydantic", "pydantic-ai-slim[anthropic,openai]==2.59.0", "pypdfium2==5.14.0", "PyYAML==6.0.3", "sentry-sdk==2.71.0", "uvicorn", "websockets"]

[project.scripts]
orbit-hub = "orbit_hub.cli:main"
orbit-mcp = "orbit_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
