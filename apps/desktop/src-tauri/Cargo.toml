[package]
name = "orbit-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "orbit_desktop"
path = "src/lib.rs"

[[bin]]
name = "orbit-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
orbit-app-core = { path = "../../../crates/orbit-app-core" }
orbit-core = { path = "../../../crates/orbit-core" }
# The daemon runs inside the app, on a thread of its own.
orbit-daemon = { path = "../../../crates/orbit-daemon" }
orbit-ipc = { path = "../../../crates/orbit-ipc" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
# Copy from the chat without WebKit's clipboard prompt (Tauri issue #12007).
# 2.4.0 and later require Tauri 2.12; the lock holds 2.11.5.
tauri-plugin-clipboard-manager = "=2.3.3"
# macOS notifications when a long turn ends or the agent asks, in the background
# (src/notify.rs). 2.5.0 and later require Tauri 2.12; the lock holds 2.11.5.
tauri-plugin-notification = "=2.4.0"
# «Adjuntar»: macOS's open panel, which answers with paths (the daemon
# reads the file). 2.8.x requires Tauri 2.12; the lock holds 2.11.5.
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-opener = "2"
tokio = { version = "1.48", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Safe Foundation binding; reads app-aware macOS preferences in a bundle.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSLocale", "NSArray", "NSString", "NSEnumerator"] }

[dev-dependencies]
rustix = { version = "1.1", features = ["process"] }
tempfile.workspace = true
tauri = { version = "2", features = ["test", "tray-icon"] }

[lints]
workspace = true
