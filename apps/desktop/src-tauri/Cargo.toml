[package]
name = "orbit-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
pruebas = ["orbit-core/pruebas", "dep:objc2-app-kit"]

[lib]
name = "orbit_desktop"
path = "src/lib.rs"

[[bin]]
name = "orbit-desktop"
path = "src/main.rs"

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
orbit-app-core = { path = "../../../crates/orbit-app-core" }
orbit-core = { path = "../../../crates/orbit-core" }
# The daemon runs inside the app, on a thread of its own.
orbit-daemon = { path = "../../../crates/orbit-daemon" }
orbit-ipc = { path = "../../../crates/orbit-ipc" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
# Copy from the chat without WebKit's clipboard prompt (Tauri issue #12007).
# 2.4.0 and later require Tauri 2.12; the lock holds 2.11.5.
tauri-plugin-clipboard-manager = "=2.3.3"
# «Adjuntar»: macOS's open panel, which answers with paths (the daemon
# reads the file). 2.8.x requires Tauri 2.12; the lock holds 2.11.5.
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-opener = "2"
tokio = { version = "1.48", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationSettings", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger"] }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSApplication", "NSWindow", "NSResponder"] }
# Safe Foundation binding; reads app-aware macOS preferences in a bundle.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSLocale", "NSArray", "NSString", "NSEnumerator", "NSError", "NSUUID"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["test-util"] }
rustix = { version = "1.1", features = ["process"] }
tempfile.workspace = true
tauri = { version = "2", features = ["test", "tray-icon"] }

# Objective-C SDK calls and callback pointers are confined to desktop_system/macos.
# Keep unsafe denied everywhere else in this crate.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
