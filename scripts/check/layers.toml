# The layers that scripts/check/layers.py enforces.
#
# A photo of the repository: what it has today is what is allowed. Every rule
# is exact, like boundaries.toml and size-ratchet.toml: something new fails,
# and an entry the code no longer needs fails too, so these lists only get
# shorter.

# Each workspace package and the workspace packages it uses as a normal
# dependency (dev and build dependencies do not count). A new package needs
# its line here; a new dependency between packages needs its layer to allow
# it. The engine still uses orbit-control, a Mac client package: a later
# step removes it.
[packages]
orbit-core = []
orbit-store = ["orbit-core"]
orbit-ipc = ["orbit-core"]
orbit-control = ["orbit-core"]
orbit-daemon = ["orbit-control", "orbit-core", "orbit-ipc", "orbit-store"]
orbit-app-core = ["orbit-core", "orbit-ipc"]
orbit-desktop = ["orbit-app-core", "orbit-core", "orbit-daemon", "orbit-ipc"]

# The engine packages, and what they must not do outside tests because it is
# a client's job: launch a process (command_new), branch on
# target_os = "macos" (cfg_macos), use the keychain crate (keyring) or AppKit
# (appkit). Each list holds the files that still do it; the four keys are
# always here, even when a list is empty.
[engine]
packages = ["orbit-daemon", "orbit-ipc", "orbit-store"]
command_new = ["crates/orbit-daemon/src/daemon/recording_notes/owner.rs", "crates/orbit-daemon/src/native.rs"]
cfg_macos = ["crates/orbit-daemon/src/config.rs", "crates/orbit-daemon/src/daemon/recording_notes/owner.rs"]
keyring = ["crates/orbit-daemon/src/config.rs"]
appkit = []

# The ratchet of the coordinator: the methods of `impl Runtime` in the
# package, and how many of them sit in a domain folder (daemon::<domain>).
# Both may only go down; when one does, lower it here to what was measured.
[runtime]
package = "orbit-daemon"
methods = 655
in_domains = 281
