# Allowed skips of scripts/check.sh.
#
# A skipped test is not a passed test. The gate fails on any skip (or
# expected failure) that is not listed here with its suite, its test and its
# reason.
#
# - suite: the id of the step that runs it (`scripts/check.sh --plan`).
# - test: as that suite's report names it:
#     pytest, vitest              ->  class::name from the JUnit report
#     cargo test                  ->  binary-without-hash::path::of::the::test
#     guards (unittest)           ->  module.Class.test
# - reason: why it cannot run here. No reason, no skip.
#
# The hub's e2e tests are not here and cannot be: the gate gives them ORBIT_TEST_BINARY.

[[skip]]
suite = "rust-test"
test = "orbit_daemon::daemon::finalize::tests::write_manifest_fixtures"
reason = "not a test: it regenerates the three contract recording manifests; the semantic comparison of their JSON values always runs"

[[skip]]
suite = "rust-test"
test = "orbit_daemon::daemon::topics::measurement_tests::measure_worst_case_projections"
reason = "a repeatable manual measurement on the Mac (the command is next to the test); it prints timings and checks nothing"

[[skip]]
suite = "hub-pytest"
test = "tests.test_assistant_jail::test_real_jail_hides_secrets_and_confines_writes"
reason = "only when bwrap --ro-bind / / true fails: this environment denies nested user namespaces; the reviewer must run outside the sandbox"
