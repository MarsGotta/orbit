[package]
name = "orbit-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

# The daemon as a process of its own, for development and tests; Orbit.app
# runs the daemon on a thread and does not ship this binary.
[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
orbit-core = { path = "../orbit-core" }
orbit-store = { path = "../orbit-store" }
orbit-ipc = { path = "../orbit-ipc" }
orbit-control = { path = "../orbit-control" }
anyhow.workspace = true
thiserror.workspace = true
base64.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
uuid.workspace = true
sha2.workspace = true
tokio = { version = "1.48", features = ["full"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
toml = "0.9"
directories = "6.0"
rand = "0.9"
rustix = { version = "1.1", features = ["process", "fs"] }
tempfile.workspace = true
# Error reports to Sentry, only with the person's consent. No default
# features: the panic integration (with its frames), the OS context for the
# macOS version, and the blocking reqwest transport over rustls with the ring
# provider the daemon already compiles. Nothing for tracing, logs, metrics,
# sessions or debug images.
sentry = { version = "=0.49.3", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "reqwest", "rustls-no-provider"] }
# The transport's TLS needs a process-wide provider: ring, which the daemon
# already compiles for the hub (no second crypto library).
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[dev-dependencies]
orbit-control = { path = "../orbit-control", features = ["test-support"] }
png = "=0.18.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.48", features = ["test-util"] }

[lints]
workspace = true
